name: Android APK

# Builds an installable APK on every push to a working branch, and on demand.
# The artifact is attached to the run — Actions → this run → "Artifacts".
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - 'store/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build an unsigned release AAB for Play'
        type: boolean
        default: false

permissions:
  # Needed to attach the APK to a release.
  contents: write

# Queue rather than cancel: an in-flight build is usually the one someone is
# waiting on for an APK.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK, but compileSdk 36 may not be in
      # it yet; this accepts the licences and lets Gradle fetch what's missing.
      - uses: android-actions/setup-android@v3

      # Audit and funding metadata add network round-trips and nothing else
      # here. Step timeouts keep a hang from burning the whole job budget with
      # no logs to show for it.
      - name: Install dependencies
        timeout-minutes: 12
        run: npm ci --no-audit --no-fund

      # Static export + vendored OCR engine + cap sync. See
      # scripts/build-android.mjs for what this does beyond `next build`.
      - name: Build the web bundle
        timeout-minutes: 15
        run: npm run android:build

      - name: Assemble debug APK
        timeout-minutes: 25
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report size
        run: |
          echo "### APK built :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          for f in android/app/build/outputs/apk/debug/*.apk; do
            echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          done
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Download it from the **Artifacts** section of this run, copy it to an Android phone and open it. You will be asked to allow installing from unknown sources once.' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: scanfast-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # An Actions artifact is a zip behind a login, which is awkward to install
      # from a phone. A release asset is a direct .apk link you can just tap.
      # The tag is stable, so the link never changes between builds.
      - name: Publish the APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=apk-latest
          cp android/app/build/outputs/apk/debug/app-debug.apk ScanFast.apk
          NOTES="Debug build of ScanFast from \`${GITHUB_SHA:0:7}\`.

          Install: download **ScanFast.apk** on an Android phone and open it. Android will ask once to allow installing from this source.

          Works fully offline, including text recognition. This is a debug build for testing — the Play release is built with \`npm run android:aab\` and your own signing key (see docs/play-store.md)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ScanFast.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" ScanFast.apk \
              --title "ScanFast — latest test APK" \
              --notes "$NOTES" \
              --prerelease
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** $(gh release view "$TAG" --json url -q .url)" >> $GITHUB_STEP_SUMMARY

      # Unsigned: Play needs a bundle signed with your own upload key, which
      # never belongs in CI without a secret. See docs/play-store.md.
      - name: Assemble release AAB (unsigned)
        if: inputs.release
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: scanfast-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
